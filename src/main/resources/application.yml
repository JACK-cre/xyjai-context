spring:
  application:
    name: xyj-context
  ai:
    openai:
      base-url: https://dashscope.aliyuncs.com/compatible-mode
      api-key: sk-ae8790c4689f4fe1ae0729ec0d7725ba
      chat:
        options:
          model: qwen-turbo
      embedding:
        options:
          model: text-embedding-v3
    vectorstore:
      chroma:
        host: localhost
        port: 8000
        collection-name: xyj_rag_docs
        initialize-schema: true
  datasource:
    url: jdbc:mysql://localhost:3306/ai_data_analyst_chat
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 5000
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 2
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    virtual-host: /
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 10
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

logging:
  level:
    org.springframework.ai: debug
    org.example.xyjai: debug

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: org.example.xyjcontext.model
  configuration:
    map-underscore-to-camel-case: true

jwt:
  secret: spring-ai-secret-key-for-jwt-token-generation-2026
  expiration: 86400000

# ????
rate-limit:
  chat:
    max-requests: 100      # ????????
    window-seconds: 1    # ????(?)

