spring:
  application:
    name: xyj-context
  ai:
    openai:
      base-url: https://dashscope.aliyuncs.com/compatible-mode
      # 仅用于让本地上下文测试完成初始化；生产环境必须通过 DASHSCOPE_API_KEY 覆盖。
      api-key: ${DASHSCOPE_API_KEY:dev-placeholder}
      chat:
        options:
          model: qwen-turbo
      embedding:
        options:
          model: text-embedding-v3
    vectorstore:
      chroma:
        host: localhost
        port: 8000
        collection-name: xyj_rag_docs
        initialize-schema: true
  datasource:
    url: jdbc:mysql://localhost:3306/ai_data_analyst_chat
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 5000
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 2
  rabbitmq:
    host: localhost
    port: 5672
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: /
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 10
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

logging:
  level:
    org.springframework.ai: debug
    org.example.xyjai: debug

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: org.example.xyjaicontext.model
  configuration:
    map-underscore-to-camel-case: true

jwt:
  secret: ${JWT_SECRET:change-me-in-production}
  expiration: ${JWT_EXPIRATION:86400000}

# ????
rate-limit:
  chat:
    max-requests: 100      # ????????
    window-seconds: 1    # ????(?)

agent:
  graph:
    enabled: ${AGENT_GRAPH_ENABLED:true}
  context:
    max-chars: ${AGENT_CONTEXT_MAX_CHARS:12000}
    recent-message-count: ${AGENT_RECENT_MESSAGE_COUNT:8}
  rag:
    top-k: ${AGENT_RAG_TOP_K:6}
    similarity-threshold: ${AGENT_RAG_SIMILARITY_THRESHOLD:0.72}
  model:
    timeout-seconds: ${AGENT_MODEL_TIMEOUT_SECONDS:60}
  document:
    result-ttl-hours: ${AGENT_DOCUMENT_RESULT_TTL_HOURS:168}
